PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no

# Allow the non-root administrative account to use a password as a recovery
# method. Root remains key-only through PermitRootLogin above.
Match User rainwave-admin
    PasswordAuthentication yes
