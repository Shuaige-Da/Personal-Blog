server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rainwave.top www.rainwave.top;

    client_max_body_size 220M;

    ssl_certificate /etc/letsencrypt/live/rainwave.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rainwave.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /static/uploads/ {
        alias /var/www/rainwave-shared/uploads/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /static/ {
        alias /var/www/rainwave-current/frontend/static/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        limit_req zone=rainwave_general burst=60 nodelay;
        limit_req_status 429;
        limit_conn rainwave_per_ip 30;

        proxy_pass http://rainwave_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rainwave.top www.rainwave.top;

    return 301 https://$host$request_uri;
}
